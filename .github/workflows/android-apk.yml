name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run prepare:www
      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/intelligence-7mit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-7mit-apk
          path: dist/intelligence-7mit.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: intelligence.7mit APK #${{ github.run_number }}
          files: dist/intelligence-7mit.apk
