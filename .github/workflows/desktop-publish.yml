name: Desktop Publish Release

# Menerbitkan draft GitHub Release yang dibuat oleh "Desktop Build" (tanpa membangun ulang).
# Jalankan manual: Actions -> Desktop Publish Release -> Run workflow (isi tag, mis. desktop-v1.0.0).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis draft yang diterbitkan
        required: true
        default: desktop-v1.0.0
      prerelease:
        description: Tandai sebagai pre-release (build belum bertanda tangan)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Terbitkan draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name==\"${TAG}\" and .draft==true) | .id" | head -n1)
          if [ -z "$id" ]; then echo "Draft release dengan tag ${TAG} tidak ditemukan (sudah terbit atau belum dibuat)."; exit 1; fi
          echo "Release id: $id"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F draft=false -F prerelease="${PRE}" --jq '.html_url' | tee release-url.txt
          echo "### Rilis diterbitkan" >> "$GITHUB_STEP_SUMMARY"
          cat release-url.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq '.assets[] | "- " + .name + " (" + (.size/1048576|floor|tostring) + " MB)"' | tee -a "$GITHUB_STEP_SUMMARY"
